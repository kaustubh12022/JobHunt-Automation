# ============================================
# AutoApply Configuration
# ============================================

# --- AI Settings ---
ai:
  provider: "deepseek"
  scoring_model: "deepseek-chat"
  tailoring_model: "deepseek-chat"
  model: "deepseek-chat"
  api_key: ""
  temperature: 0.3

# --- Job Search Settings ---
search:
  platforms:
    - "naukri"
    - "instahyre"
    - "internshala"
    - "unstop"
    - "hirist"
    - "workday"
    - "linkedin"
    - "indeed"
  search_terms:
    # MERN
    - "Junior Full Stack Developer"
    - "Junior Node.js Developer"
    - "Junior React Developer"
    # Java
    - "Associate Java Developer"
    - "Junior Java Developer"
    # Backend
    - "Junior Backend Developer"
    - "Associate Backend Developer"
    # Enterprise Fresher
    - "Graduate Engineer Trainee"
    - "Associate Software Engineer"
    - "Software Engineer Trainee"
    # Applied AI
    - "GenAI Developer"
    - "AI Full Stack Developer"
  locations:
    - "Pune"
    - "Mumbai"
    - "Bangalore"
  hours_old: 48                            # Set to 48h per user requirement
  results_wanted: 50                      # Clamped from 100 -> 50 (practical LinkedIn ceiling)
  job_types:
    - "internship"
    - "fulltime"
  country_indeed: "India"
  proxies: []                             # Add proxies here: ["user:pass@host:port"]

# --- Scoring Settings ---
scoring:
  minimum_score: 75
  top_n: 30

# --- Test Mode Settings ---
test_mode:
  enabled: false
  search_terms:
    - "Junior Java Developer"
  locations:
    - "Pune"
  platforms:
    - "linkedin"
  results_wanted: 5
  skip_workday: true
  score_top_n: 3
  tailor_top_n: 1

# --- Output Settings ---
output:
  desktop_path: "C:/Users/kalek/Desktop"
  folder_name: "AutoApply_Output"

# --- Email Settings ---
email:
  enabled: true
  sender: "kaustubh.kale.work@gmail.com"
  recipient: "kaustubh.kale.work@gmail.com"
  app_password: ""

# --- Resume Settings ---
resume:
  style: "ats_clean"
  max_pages: 1
