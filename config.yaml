# ============================================
# AutoApply Configuration
# ============================================

# --- AI Settings ---
ai:
  provider: "deepseek"
  scoring_model: "deepseek-chat"
  tailoring_model: "deepseek-chat"
  model: "deepseek-chat"
  api_key: ""
  temperature: 0.3

# --- Job Search Settings ---
search:
  platforms:
    - "linkedin"
    - "indeed"
  search_terms:
    # Simple, high-yield terms (Boolean AND/OR is unreliable in jobspy)
    - "Automation Tester"
    - "QA Automation"
    - "Java Developer"
    - ".NET Developer"
    - "Software Tester"
    - "Software Engineer"
    - "Backend Developer"
    - "Full Stack Developer"
  locations:
    - "Pune"
    - "Mumbai"
    - "Bangalore"
  hours_old: 72                            # Broadened from 24h to 72h for fresher coverage
  results_wanted: 20                      # Per-combination full page pull
  job_types:
    - "internship"
    - "fulltime"
  country_indeed: "India"
  proxies: []                             # Add proxies here: ["user:pass@host:port"]

# --- Scoring Settings ---
scoring:
  minimum_score: 60
  top_n: 30

# --- Test Mode Settings ---
test_mode:
  enabled: false
  search_terms:
    - "QA Automation"
  locations:
    - "Pune"
  platforms:
    - "linkedin"
  results_wanted: 5
  skip_workday: true
  score_top_n: 3
  tailor_top_n: 1

# --- Output Settings ---
output:
  desktop_path: "C:/Users/kalek/OneDrive/Desktop"
  folder_name: "AutoApply_Output"

# --- Email Settings ---
email:
  enabled: true
  sender: "kaustubh.kale.work@gmail.com"
  recipient: "kaustubh.kale.work@gmail.com"
  app_password: ""

# --- Resume Settings ---
resume:
  style: "ats_clean"
  max_pages: 1
