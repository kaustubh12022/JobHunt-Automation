# ============================================
# AutoApply Configuration
# ============================================

# --- AI Settings ---
ai:
  provider: "deepseek"
  scoring_model: "deepseek-chat"
  tailoring_model: "deepseek-chat"
  model: "deepseek-chat"
  api_key: ""
  temperature: 0.3

# --- Job Search Settings ---
search:
  platforms:
    - "linkedin"
    - "indeed"
    - "workday"
    - "naukri"
    - "internshala"
    - "hirist"
  search_terms:
    # Full Stack & Web
    - "Full Stack Developer"
    - "React Developer"
    - "Node.js Developer"
    # Java & Backend
    - "Java Developer"
    - "Backend Developer"
    - "Python Developer"
    # Enterprise Fresher & Trainee
    - "Graduate Engineer Trainee"
    - "Software Engineer Trainee"
    - "Associate Software Engineer"
    - "SDE Intern"
    # Applied AI & Emerging Tech
    - "GenAI Developer"
    - "AI Full Stack Developer"

  buckets:
    full_stack:
      name: "Full Stack & Web"
      max_results: 50
      queries:
        - "Full Stack Developer"
        - "React Developer"
        - "Node.js Developer"
    java_backend:
      name: "Java & Backend"
      max_results: 50
      queries:
        - "Java Developer"
        - "Backend Developer"
        - "Python Developer"
    enterprise_trainee:
      name: "Enterprise Trainee & SDE Intern"
      max_results: 50
      queries:
        - "Graduate Engineer Trainee"
        - "Software Engineer Trainee"
        - "Associate Software Engineer"
        - "SDE Intern"
    ai_genai:
      name: "Applied AI & Emerging Tech"
      max_results: 50
      queries:
        - "GenAI Developer"
        - "AI Full Stack Developer"
  locations:
    - "Pune"
    - "Mumbai"
    - "Bangalore"
  hours_old: 48                            # Set to 48h per user requirement
  max_experience_years: 0                  # Only keep jobs where min_experience <= this value (0 = fresher only)
  results_wanted: 500                      # Global scraper ceiling across all search terms
  job_types:
    - "internship"
    - "fulltime"
  country_indeed: "India"
  proxies: []                             # Add proxies here: ["user:pass@host:port"]

# --- Scoring Settings ---
scoring:
  minimum_score: 75
  top_n: 30

# --- Test Mode Settings ---
test_mode:
  enabled: false
  search_terms:
    - "Junior Java Developer"
  locations:
    - "Pune"
  platforms:
    - "linkedin"
  results_wanted: 5
  skip_workday: true
  score_top_n: 3
  tailor_top_n: 1

# --- Output Settings ---
output:
  desktop_path: "C:/Users/kalek/Desktop"
  folder_name: "AutoApply_Output"

# --- Email Settings ---
email:
  enabled: true
  sender: "kaustubh.kale.work@gmail.com"
  recipient: "kaustubh.kale.work@gmail.com"
  app_password: ""

# --- Resume Settings ---
resume:
  style: "ats_clean"
  max_pages: 1
